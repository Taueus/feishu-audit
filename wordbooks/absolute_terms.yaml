# 规则六 广告法绝对化用语（极限词）词库：文中命中任一项即判「不通过」
# terms    —— 精确子串匹配（不区分大小写），列出完整词避免误伤「最后/最近/第一天」
# patterns —— 正则匹配，捕获「最X」「第X」等组合形态（如「史上销量最好」「全球第1」）
# 命中折叠：若某命中词是另一命中词的子串，只报最长的（如命中「最顶级」不再重复报「顶级」）
# 可自行增删；每次审核运行时重新加载，改完无需重启服务。

terms:
  # 「最」字类（完整词）
  - 最强
  - 最佳
  - 最好
  - 最优
  - 最顶级
  - 最高级
  - 最高端
  - 最优质
  - 最优秀
  - 最先进
  - 最专业
  - 最权威
  - 最奢侈
  - 最极致
  - 最完美
  - 最低价
  - 最便宜
  - 最划算
  - 最超值
  - 最受欢迎
  - 最畅销
  - 最热销
  - 最值得
  # 前缀强化类
  - 史上最
  - 全网最
  - 全国最
  - 全球最
  - 业内最
  # 「第一」类（完整词，避免误伤「第一天/第一次」）
  - 世界第一
  - 全球第一
  - 全国第一
  - 行业第一
  - 销量第一
  - 销量冠军
  - 排名第一
  - 第一品牌
  - 第一选择
  # 级别类
  - 国家级
  - 世界级
  - 国际级
  # 极限形容类
  - 顶级
  - 顶尖
  - 极致
  - 极品
  - 完美
  - 无与伦比
  - 绝无仅有
  - 独一无二
  - 遥遥领先
  - 独家
  - 唯一
  - 首选
  - 首创

patterns:
  # 「范围+第一/第1/第一名」组合
  - (?:世界|全球|全国|全网|全城|行业|业内|市场|销量|口碑|排名|品类|单品|品牌)第[一1]名?
  # NO.1 / TOP1 及常见变体
  - (?i)(?:no|top)[.．\s]*1
  # 史上/全网/全球……最 + 结尾词（整词命中，如「史上销量最好」，可折叠掉单报的「最好」）
  - (?:史上|全网|全球|全国|业内)[^，。；！？\n]{0,6}最[^\s，。；！？\n]{0,2}
  # 最 + 常见营销形容词（如「最牛」「最香」）
  - 最[牛燃炸酷潮香醇爽劲鲜纯]{1,2}
