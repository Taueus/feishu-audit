# ============================================================
# 飞书文档审核机器人 · 配置模板
# 用法：复制本文件为 config.yaml 后填写。config.yaml 已被 .gitignore
#       排除，请勿提交到任何仓库（含 app_secret / api_key 等密钥）。
# 完整说明见 README.md「配置」章节；也可直接在运维面板里填写并保存。
# ============================================================

# 飞书开放平台应用凭证（开放平台 > 你的应用 > 凭证与基础信息）
app_id: cli_xxxxxxxxxxxxxxxx
app_secret: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

# 待审核的电子表格（链接中 /sheets/ 后面那串字符；支持粘贴完整链接自动解析）
spreadsheet_token: xxxxxxxxxxxxxxxxxxxxxxxx
# 表格所在云空间文件夹 token（/folder/ 后面的部分）。
# 留空则按文件名全盘搜索（用于把附件名映射回本地文件，非必需，一般留空）
folder_token: ""

# ===== LLM 品牌识别（可选）=====
# 任意 OpenAI 兼容 /chat/completions 接口均可。
# api_key 留空 = 纯词库模式（仅规则一/二/三 + 本地竞品词库，不发 LLM 请求）
llm:
  base_url: https://api.deepseek.com
  api_key: ""
  model: deepseek-chat

# ===== 表头列名映射 =====
# 按目标表格的实际表头填写；机器人只审「回链」列中的 .doc/.docx 附件，
# 其他链接或空值一律跳过。「机器审核」列已有值的行会自动跳过（可增量补审）。
columns:
  keyword: 项目          # 我方关键词（一格里可放多个，用逗号/顿号/空格分隔）
  link: 回链            # 文档附件所在列
  result: 机器审核       # 审核结果回写列
  reason: 不通过原因     # 不通过原因回写列

# ===== 规则二：违禁词（出现即不通过）=====
forbidden_words: [AI生成, 免责声明]

# ===== 规则四：观点级主角性判定（LLM，无需额外配置）=====
# 稿子允许竞品对比，但必须突出我方。采用「LLM 抽取事实 + 确定性代码判罚」架构：
# LLM 把正文切成观点块并只填客观属性（kind/mine_present/comps_count/evidence），
# 是否违规由代码 judge() 按固化口径判罚。现行判据（v8）仅两条，命中任一即不通过：
#   ① 观点被竞品占据：某 reco 推荐块整块没有我方，却成片推荐 ≥2 款竞品；
#   ② 避雷/负面现我方：避雷/别买/不推荐/翻车/劝退类负面块中出现我方。
# 豁免：list 盘点/阵营横评/榜单归位类块一律不判；reco 块内竞品仅 1 款不判。
# 原判据「观点内竞品先于我方并占优」已合并到规则三（全文级位置比对）。
# 只要配置了下方 llm.api_key 即自动生效；未配置 API Key 时规则四自动跳过。
# 不再使用全文「竞品提及处数 vs 我方提及处数」的总量比对。

# ===== 规则五：AI 人味 & AI 收录友好度（LLM + 本地启发式）=====
# 文章须同时满足：①人看/AI 检测器都看不出是 AI 写的；②能被 AI 引擎抓取引用且有利于我方。
# 硬性一票否决（任一命中即不通过）：ai_tone_heavy（套话堆砌/无第一人称/零具体事实）、
# ad_only_no_info（通篇只有推销无可被引用资料）、!mine_citable（无"可直接回答用户问题"
# 的我方断言）。另有 9 条「收录优化建议」不判死，仅随结果返回给作者改稿。
# 仅在我方关键词确在文中出现时判定；未配置 API Key 时静默跳过。

# ===== 高级：规则词库 =====
# wordbooks/ai_terms.yaml  规则一 AI 痕迹词库（命中即不通过）
# wordbooks/brands.yaml    本地竞品品牌词库（参与规则三位置比对）

# ===== 各规则启停开关（每条独立可关，默认全开）=====
# r1 规则一·AI 痕迹词（确定性，命中 wordbooks/ai_terms.yaml 即不通过）
# r2 规则二·违禁词（确定性，命中 forbidden_words 即不通过）
# r3 规则三·关键词位置（确定性，我方须先于竞品出现）
# r4 规则四·观点级主角性（LLM，按观点块判定：观点被竞品占据 / 负面块现我方）
# r5 规则五·AI 人味 & AI 收录友好度（LLM+启发式，硬性一票否决 + 建议项）
# 也可在运维面板「审核规则启停」卡片切换。LLM 类规则需 llm.api_key 配置才生效。
rules_enabled:
  r1: true
  r2: true
  r3: true
  r4: true
  r5: true

# ===== 审核速度（数据量大时调优）=====
# 并发审核的文档数：多个文档并行处理（下载附件 + LLM 判定）。
# 默认 4；设为 1 = 串行（旧行为）。上限 16。
# 注意：并发数过高可能触发 LLM 服务商限流（429），若频繁报「LLM 判定失败」可调低。
# 其他已内置的提速手段：附件按 file_token 本地缓存（重审免下载）、
# LLM 判定结果按正文 md5 缓存（重审零调用）、回写走批量接口（一次最多 500 格）。
concurrency: 4
